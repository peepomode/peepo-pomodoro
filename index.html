<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pepe Timer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Pepe Timer</h1>
        <div class="pepe-grid">
            <img src="https://i.imgur.com/8nLFCVP.png" alt="Happy Pepe" class="pepe-img">
            <img src="https://i.imgur.com/c76UqNN.gif" alt="Sad Pepe" class="pepe-img">
            <img src="https://i.https://i.imgur.com/bCBt6ga.jpeg.com/YnQHDft.png" alt="Cool Pepe" class="pepe-img">
            <img src="https://i.imgur.https://i.imgur.com/EXXtWON.mp4/dJBvmr9.png" alt="Thinking Pepe" class="pepe-img">
            <img src="https://i.imgur.com/https://i.imgur.com/laeBKUo.gif.png" alt="Coffee Pepe" class="pepe-img">
            <img src="https://i.imgur.com/8nLFCVP.png" alt="Happy Pepe" class="pepe-img">
            <img src="https://i.imgur.com/c76UqNN.gif" alt="Sad Pepe" class="pepe-img">
            <img src="https://i.https://i.imgur.com/bCBt6ga.jpeg.com/YnQHDft.png" alt="Cool Pepe" class="pepe-img">
            <img src="https://i.imgur.https://i.imgur.com/EXXtWON.mp4/dJBvmr9.png" alt="Thinking Pepe" class="pepe-img">
            <img src="https://i.imgur.com/https://i.imgur.com/laeBKUo.gif.png" alt="Coffee Pepe" class="pepe-img">
        </div>
        <div class="mode-toggle">
            <button id="work-mode" class="mode-active">Work Mode</button>
            <button id="rest-mode">Rest Mode</button>
        </div>
        <div class="timer">
            <span id="minutes">25</span>:<span id="seconds">00</span>
        </div>
        <div class="controls">
            <button id="start">Start</button>
            <button id="pause">Pause</button>
            <button id="reset">Reset</button>
        </div>
        <div class="status">
            <p id="status-text">Work Time</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
