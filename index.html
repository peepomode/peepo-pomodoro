<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pepe Timer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Pokemon Timer</h1>
        <div class="pepe-grid">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/143.png" alt="Snorlax" class="pepe-img">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" alt="Pikachu" class="pepe-img">
        </div>
        <div class="mode-toggle">
            <button id="work-mode" class="mode-active">Work Mode</button>
            <button id="rest-mode">Rest Mode</button>
        </div>
        <div class="current-task">
            <h2 id="task-display"></h2>
        </div>
        <div class="timer">
            <span id="minutes">25</span>:<span id="seconds">00</span>
        </div>
        <div class="controls">
            <button id="start">Start</button>
            <button id="pause">Pause</button>
            <button id="reset">Reset</button>
        </div>
        <div class="status">
            <p id="status-text">Work Time</p>
        </div>
        <div class="task-input">
            <input type="text" id="task-input" placeholder="What are you focusing on?">
        </div>
        <div class="time-adjust">
            <button id="add-time">Add 5 mins</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
